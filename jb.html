<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ViperClient</title>
    <style>
      * { box-sizing:border-box; }
      html, body {
        margin:0; padding:0; min-height:100%;
        background:#020806; color:#c9f5db;
        font:15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        overflow-x:hidden;
      }
      /* ===== BG ===== */
      #bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
        background:
          radial-gradient(900px 480px at 50% -10%, rgba(0,255,136,.14), transparent 60%),
          radial-gradient(700px 500px at 85% 100%, rgba(0,204,102,.10), transparent 60%),
          radial-gradient(700px 500px at 10% 100%, rgba(0,255,136,.08), transparent 60%),
          linear-gradient(180deg, #03130b 0%, #020806 45%, #010503 100%);
      }
      #bg .grid { position:absolute; inset:-50% -50%;
        background-image: linear-gradient(rgba(0,255,136,.07) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0,255,136,.07) 1px, transparent 1px);
        background-size:44px 44px;
        transform: perspective(600px) rotateX(58deg) scale(1.4);
        transform-origin:50% 30%;
        animation: gridmove 9s linear infinite;
        mask-image: linear-gradient(to bottom, transparent 20%, black 55%, transparent 92%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 55%, transparent 92%);
      }
      @keyframes gridmove { from { background-position:0 0, 0 0; } to { background-position:0 44px, 0 0; } }
      #bg .orb { position:absolute; border-radius:50%; }
      #bg .orb1 { width:520px; height:520px; left:-140px; top:-140px;
        background: radial-gradient(circle, rgba(0,255,136,.20) 0%, transparent 65%); animation: float1 9s ease-in-out infinite; }
      #bg .orb2 { width:620px; height:620px; right:-180px; bottom:-220px;
        background: radial-gradient(circle, rgba(0,230,122,.14) 0%, transparent 65%); animation: float1 11s ease-in-out infinite reverse; }
      @keyframes float1 { 0%,100% { transform:translateY(0);} 50% { transform:translateY(26px);} }
      #bg .scan { position:absolute; inset:0;
        background: repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 4px); }
      #bg .beam { position:absolute; left:0; right:0; height:120px; top:-140px;
        background: linear-gradient(to bottom, transparent, rgba(0,255,136,.09), transparent);
        animation: beamscan 5.5s linear infinite; }
      @keyframes beamscan { to { transform:translateY(120vh); } }

      #topline { position:fixed; top:0; left:0; right:0; height:3px; z-index:5;
        background: linear-gradient(90deg, transparent, #00ff88 20%, #7cffb2 50%, #00ff88 80%, transparent);
        background-size:200% 100%; animation: shimmer 2.8s linear infinite;
        box-shadow:0 0 14px rgba(0,255,136,.8); }
      @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }

      #brand { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
        padding:12px 20px; background:rgba(3,18,11,.86);
        border-bottom:1px solid rgba(0,255,136,.22);
        box-shadow:0 4px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(0,255,136,.12); }
      #brand .left { display:flex; align-items:center; gap:11px; }
      #brand .mini { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
        background: radial-gradient(circle at 30% 25%, #0a2e1c, #03130b);
        border:1px solid rgba(0,255,136,.55);
        box-shadow:0 0 16px rgba(0,255,136,.45), inset 0 0 12px rgba(0,255,136,.18); }
      #brand .mini svg { width:22px; height:22px; display:block; filter: drop-shadow(0 0 6px rgba(0,255,136,.9)); }
      #brand b { font-size:15px; font-weight:900; letter-spacing:.22em; color:#eafff3;
        text-shadow:0 0 14px rgba(0,255,136,.65); }
      #brand b em { font-style:normal; color:#00ff88; }
      #brand .ver { font-size:10px; font-weight:800; letter-spacing:.12em; color:#03130b;
        background:linear-gradient(180deg,#7cffb2,#00ff88); padding:4px 9px; border-radius:999px;
        box-shadow:0 0 12px rgba(0,255,136,.7); }
      #brand .right { display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.16em; color:#7fd0a0; font-weight:700; }
      #brand .dot { width:9px; height:9px; border-radius:50%; background:#00ff88;
        box-shadow:0 0 10px #00ff88; animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity:1;} 50% { opacity:.4;} }

      /* ===== STAGE (loader) ===== */
      #stage { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;
        padding:56px 20px 20px; text-align:center; }
      .core { position:relative; width:148px; height:148px; margin:0 auto; }
      .core .logo { position:absolute; inset:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        background: radial-gradient(circle at 50% 30%, #0e3a22 0%, #04160c 62%, #020806 100%);
        border:1px solid rgba(0,255,136,.6);
        box-shadow:0 0 34px rgba(0,255,136,.4), inset 0 0 24px rgba(0,255,136,.2);
        animation: logopulse 2.4s ease-in-out infinite; z-index:3; }
      @keyframes logopulse { 0%,100% { box-shadow:0 0 24px rgba(0,255,136,.3);} 50% { box-shadow:0 0 50px rgba(0,255,136,.6);} }
      .core .logo svg { width:58px; height:58px; filter: drop-shadow(0 0 10px rgba(0,255,136,.9)); }
      /* ViperClient neon spinner */
      #spin {
        position:absolute; inset:0;
        border:4px solid rgba(0,255,136,.14);
        border-top-color:#00ff88; border-right-color:#7cffb2;
        border-radius:50%;
        animation: spin 0.9s linear infinite;
        box-shadow:0 0 26px rgba(0,255,136,.25), inset 0 0 18px rgba(0,255,136,.08);
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      .ring2 { position:absolute; inset:12px; border-radius:50%;
        border:2px dashed rgba(0,255,136,.35);
        animation: spinrev 4s linear infinite; }
      @keyframes spinrev { to { transform:rotate(-360deg); } }
      .core .check { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
        font-size:64px; font-weight:900; color:#00ff88;
        text-shadow:0 0 24px rgba(0,255,136,.9); z-index:4; }

      .loadtitle { margin:26px 0 2px; font-size:34px; font-weight:900; letter-spacing:.16em; color:#f0fff6;
        text-shadow:0 0 20px rgba(0,255,136,.4); }
      .loadtitle span { background:linear-gradient(180deg,#c8ffe2,#00ff88 60%,#00a95c);
        -webkit-background-clip:text; background-clip:text; color:transparent; }
      .loadsub { display:flex; align-items:center; gap:9px; justify-content:center;
        font-size:12px; font-weight:800; letter-spacing:.24em; color:#00ff88;
        text-shadow:0 0 10px rgba(0,255,136,.6); margin-top:8px; text-transform:uppercase; }
      .loadsub .pdot { width:9px; height:9px; border-radius:50%; background:#00ff88;
        box-shadow:0 0 10px #00ff88; animation: blink 1.1s infinite; }
      .loadbar { width:min(420px, 80vw); height:8px; margin:20px auto 0; border-radius:999px; overflow:hidden;
        background:#06150d; border:1px solid rgba(0,255,136,.28);
        box-shadow:inset 0 1px 3px rgba(0,0,0,.8), 0 0 16px rgba(0,255,136,.15); }
      .loadbar > div { height:100%; width:36%; border-radius:999px;
        background:linear-gradient(90deg,#00994d,#00ff88,#7cffb2);
        box-shadow:0 0 14px rgba(0,255,136,.8);
        animation: barslide 1.4s ease-in-out infinite; }
      @keyframes barslide { 0% { margin-left:-36%; } 100% { margin-left:100%; } }
      .tiny { margin-top:14px; font-size:11px; letter-spacing:.14em; color:#4d6a58; }
      .tiny b { color:#00cc6e; }

      /* #msg — hidden unless body.fail (preserved hook) */
      #msg {
        position:relative; z-index:2;
        display:none; max-width:560px; margin:18px auto 0; padding:16px 22px; text-align:center;
        font-size:15px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
        color:#ffd9d9; background:rgba(60,8,8,.6); border:1px solid rgba(255,90,90,.55); border-radius:14px;
        box-shadow:0 0 30px rgba(255,60,60,.25), inset 0 0 18px rgba(255,60,60,.08);
      }
      /* ViperClient result states */
      body.done #spin, body.done .ring2 { display:none; }
      body.done .core .logo { box-shadow:0 0 54px rgba(0,255,136,.7), inset 0 0 26px rgba(0,255,136,.3); border-color:#00ff88; }
      body.done .core .check { display:flex; animation: pop 0.5s ease-out; }
      body.done .core .logo svg { display:none; }
      body.done .loadbar > div { animation:none; margin-left:0; width:100%; }
      body.done .loadsub { color:#7cffb2; }
      @keyframes pop { from { transform:scale(.4); opacity:0;} to { transform:scale(1); opacity:1;} }
      body.fail #spin, body.fail .ring2, body.fail .loadbar { display:none; }
      body.fail #msg { display:block; animation: shake .4s ease; }
      @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
      body.fail .core .logo { border-color:#ff6b6b; box-shadow:0 0 34px rgba(255,60,60,.5); }

      /* ===== ViperClient LOG MODE ===== */
      #wrap { padding:0; position:relative; z-index:2; }
      #state, #out { display:none; }
      body.log #stage { display:none; }
      body.log #msg { display:none !important; }
      body.log #wrap { padding:16px 18px 30px; max-width:860px; margin:0 auto; }
      body.log #state {
        display:block; font-size:20px; font-weight:900; letter-spacing:.1em; margin:0 0 10px;
        color:#eafff3; text-shadow:0 0 14px rgba(0,255,136,.5); text-transform:uppercase;
      }
      body.log #state::before { content:"VIPERCLIENT // "; color:#00ff88; }
      body.log #out {
        display:block; white-space:pre-wrap;
        font:12px/1.5 Consolas, monospace; color:#8ff5b6;
        background:rgba(2,12,7,.95); border:1px solid rgba(0,255,136,.3); border-radius:12px;
        padding:14px 16px; min-height:50vh; max-height: calc(100vh - 200px); overflow-y:auto;
        box-shadow:0 0 30px rgba(0,255,136,.12), inset 0 0 30px rgba(0,255,136,.04);
      }
      .ok { color:#00ff88; text-shadow:0 0 8px rgba(0,255,136,.6); }
      .bad { color:#ff7b7b; }
      .warn { color:#ffd166; }
      .safe { color:#00ff88; }
      .danger { color:#ff7b7b; }
      code { color:#9fe8bd; }
      #particles { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.7; }
      @media (max-width:520px) { .loadtitle { font-size:26px; } }
    </style>
  </head>
  <body>
    <div id="topline"></div>
    <div id="bg"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div><div class="beam"></div><div class="scan"></div></div>
    <canvas id="particles"></canvas>

    <div id="brand">
      <div class="left">
        <div class="mini">
          <svg viewBox="0 0 100 100"><defs><linearGradient id="vg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ffe2"/><stop offset=".5" stop-color="#00ff88"/><stop offset="1" stop-color="#00a95c"/></linearGradient></defs><path d="M8 16 L50 90 L92 16 L71 16 L50 60 L29 16 Z" fill="url(#vg3)"/><circle cx="34" cy="24" r="4" fill="#02130a"/><circle cx="66" cy="24" r="4" fill="#02130a"/></svg>
        </div>
        <b>VIPER<em>CLIENT</em></b>
        <span class="ver">GREEN</span>
      </div>
      <div class="right"><span class="dot"></span> EXPLOIT ARMED</div>
    </div>

    <div id="stage">
      <div class="core">
        <div class="logo">
          <svg viewBox="0 0 100 100"><defs><linearGradient id="vg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ffe9"/><stop offset=".45" stop-color="#00ff88"/><stop offset="1" stop-color="#00994d"/></linearGradient></defs><path d="M8 16 L50 90 L92 16 L71 16 L50 60 L29 16 Z" fill="url(#vg4)"/><circle cx="34" cy="24" r="4.5" fill="#02130a"/><circle cx="66" cy="24" r="4.5" fill="#02130a"/><circle cx="35.5" cy="22.5" r="1.4" fill="#00ff88"/><circle cx="67.5" cy="22.5" r="1.4" fill="#00ff88"/></svg>
        </div>
        <div id="spin"></div>
        <div class="ring2"></div>
        <div class="check">&#10003;</div>
      </div>
      <div class="loadtitle">VIPER<span>CLIENT</span></div>
      <div class="loadsub"><span class="pdot"></span> injecting venom &mdash; hold tight</div>
      <div class="loadbar"><div></div></div>
      <div class="tiny">GREEN EDITION &bull; DO NOT POWER OFF &bull; <b>?log=1</b> FOR VERBOSE</div>
    </div>

    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
    <script>
      // ViperClient ambient particles
      try {
        (function(){
          var c = document.getElementById("particles"); if(!c || !c.getContext) return;
          var x = c.getContext("2d"), W, H, P = [];
          function rs(){ W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
          window.addEventListener("resize", rs); rs();
          for (var i=0;i<32;i++) P.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2+0.6, s:Math.random()*0.6+0.15, o:Math.random()*0.5+0.15});
          (function tick(){
            x.clearRect(0,0,W,H);
            for (var j=0;j<P.length;j++){ var p=P[j]; p.y-=p.s; if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
              x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fillStyle="rgba(0,255,136,"+p.o+")"; x.shadowColor="#00ff88"; x.shadowBlur=8; x.fill(); x.shadowBlur=0; }
            setTimeout(function(){ if(window.requestAnimationFrame) requestAnimationFrame(tick); else setTimeout(tick,50); },33);
          })();
        })();
      } catch(e) {}
    </script>
  </body>
</html>
