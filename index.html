<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViperClient</title>
<style>
body{margin:0;background:#020806;color:#c9f5db;font:15px/1.5 system-ui,sans-serif;text-align:center}
main{max-width:480px;margin:60px auto;padding:24px;background:#04160c;border:1px solid #00ff88;border-radius:12px}
h1{margin:0;letter-spacing:.15em}
p.sub{margin:4px 0 0;color:#00ff88;font-size:12px;letter-spacing:.25em}
#state{display:inline-block;margin:18px 0 8px;padding:8px 16px;border:1px solid #00ff88;border-radius:999px;font-weight:700}
#state.warn{color:#ffe9a8;border-color:#ffd166}
#state.bad{color:#ffb3b3;border-color:#ff6b6b}
#det{font-size:13px;color:#8fb8a0;margin:0}
#det b{color:#00ff88}
.bar{height:8px;margin:16px 0 8px;background:#06150d;border:1px solid #00ff88;border-radius:999px;overflow:hidden}
#barfill{height:100%;width:30%;background:#00ff88}
#cache{font:11px Consolas,monospace;color:#5f7a6a;min-height:16px;margin:0}
.hint{font-size:12px;color:#6b8a77}
</style>
</head>
<body>
<main>
<h1>VIPERCLIENT</h1>
<p class="sub">PS4 JAILBREAK</p>
<div id="state">detecting firmware...</div>
<p id="det"></p>
<div class="bar"><div id="barfill"></div></div>
<p id="cache"></p>
<p class="hint">Press X or tap when prompted</p>
</main>
<script>
(function(){
var stateEl=document.getElementById("state");
var detEl=document.getElementById("det");
var cacheEl=document.getElementById("cache");
var barfill=document.getElementById("barfill");
function setState(t,c){stateEl.textContent=t;stateEl.className=c||"";}
function setCache(t,ok){
cacheEl.textContent=t;
if(/(\d+)%/.exec(t||"")){barfill.style.width=RegExp.$1+"%";}
else if(ok){barfill.style.width="100%";}
}
var params=new URLSearchParams(location.search);
var SUPPORTED={1302:1,1304:1,1350:1,1352:1};
var key=null,fwnum=null;
var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
if(m){
var ms=parseInt(m[2],16).toString(16);
if(ms.length<2)ms="0"+ms;
key=m[1]+"."+ms;
fwnum=parseInt(m[1],10)*100+parseInt(ms,10);
}
var forced=params.get("force")==="1";
var supported=forced||(fwnum!==null&&SUPPORTED[fwnum]===1);
detEl.innerHTML="firmware <b>"+(key||"unknown")+"</b>"+(supported?" &middot; <b>supported</b>":" &middot; not supported");
var target="jb.html"+location.search;
function go(){setState("loading jailbreak...","warn");location.replace(target);}
function waitForTap(msg,action){
setState(msg,"warn");
function fire(){window.removeEventListener("click",fire);window.removeEventListener("keydown",fire);action();}
window.addEventListener("click",fire);
window.addEventListener("keydown",fire);
}
if(!supported){
setState("UNSUPPORTED FIRMWARE","bad");
waitForTap("UNSUPPORTED ("+(key||"unknown")+") -- press X or tap to run anyway",go);
return;
}
var ac=window.applicationCache;
if(!ac||!document.documentElement.hasAttribute("manifest")){go();}
else if(!navigator.onLine){setCache("offline -- from cache",true);go();}
else if(ac.status===ac.IDLE){setCache("cached",true);go();}
else if(ac.status===ac.UPDATEREADY){
try{ac.swapCache();}catch(e){}
setCache("update downloaded",true);
waitForTap("UPDATE READY -- press X or tap to reload & run",function(){location.reload();});
}else{
setCache("checking cache...");
ac.addEventListener("downloading",function(){setCache("caching for offline...");},false);
ac.addEventListener("progress",function(e){if(e&&e.total)setCache("caching "+Math.round((e.loaded/e.total)*100)+"%");},false);
ac.addEventListener("cached",function(){setCache("cached for offline use",true);waitForTap("CACHED -- press X or tap to run",go);},false);
ac.addEventListener("updateready",function(){try{ac.swapCache();}catch(e){}setCache("update downloaded",true);waitForTap("UPDATE READY -- press X or tap to reload & run",function(){location.reload();});},false);
ac.addEventListener("noupdate",function(){setCache("cached -- offline ready",true);go();},false);
ac.addEventListener("error",function(){setCache("cache unavailable");waitForTap("CACHE FAILED -- press X or tap to run anyway",go);},false);
ac.addEventListener("obsolete",function(){setCache("cache obsolete");waitForTap("CACHE OBSOLETE -- press X or tap to run",go);},false);
}
})();
</script>
</body>
</html>
